{% extends "dashboard/base.html" %}

{% block content %}

<h1>Delete User</h1>
<div class="center-wrapper">
    <div class="delete-card">

    <p class="delete-warning">
        Are you sure you want to delete this user?
    </p>

    <div class="user-info">
        <strong>Username:</strong> {{ user_obj.username }} <br>
        <strong>Email:</strong> {{ user_obj.email }} <br>
        <strong>ID:</strong> {{ user_obj.id }}
    </div>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-delete-confirm">
            Yes, Delete User
        </button>

        <a href="{% url 'dashboard:users' %}" class="btn btn-cancel">
            Cancel
        </a>

    </form>

</div>


</div>

{% endblock %}
